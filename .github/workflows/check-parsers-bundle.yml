name: Check parsers bundle

# What "Publish parsers bundle" would refuse, found when it is written and not on the day of publishing:
# a parser using something Android or the installed apps do not have, or a change to src/contract that
# did not come with a new ParsersApi.VERSION. Nothing is signed or published here.
#
# For what is pushed to master. Pull requests get the same check from pull-request.yml, as the job "Parsers bundle".
on:
  push:
    branches:
      - master

permissions:
  contents: read

defaults:
  run:
    # Said outright: only then does a step stop when a command in the middle of a pipe fails
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - run: ./gradlew test --tests '*ParsersBundleTest' checkParsersBundle
